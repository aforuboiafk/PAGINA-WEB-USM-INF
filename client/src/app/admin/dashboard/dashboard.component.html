<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__header-content">
      <h1 class="dashboard__title">Panel Administrativo</h1>
      <p class="dashboard__subtitle">Gestiona los contenidos del Departamento de Informática USM</p>
    </div>
    <button class="dashboard__logout" (click)="logout()">
      <span>Cerrar sesión</span>
      <span class="icon">🚪</span>
    </button>
  </header>

  <section class="dashboard__grid">
    <a
      *ngFor="let card of cards"
      [routerLink]="card.route"
      class="dashboard__card"
      [style.--card-color]="card.color">
      <span class="dashboard__card-icon">{{ card.icon }}</span>
      <div class="dashboard__card-content">
        <h2 class="dashboard__card-title">{{ card.title }}</h2>
        <p class="dashboard__card-description">{{ card.description }}</p>
      </div>
      <span class="dashboard__card-arrow">→</span>
    </a>
  </section>

  <footer class="dashboard__footer">
    <p>© 2025 Departamento de Informática - Universidad Técnica Federico Santa María</p>
  </footer>
</div>
