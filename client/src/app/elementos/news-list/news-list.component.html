<div class="container">
    <div class="row">
        <div *ngFor="let card of news" class="col-12 col-lg-3 mb-4">
            <div class="card">
                <h4 class="card-title">{{ card.title }}</h4>
                <span class="card-text">{{ formatDate(card.date) }}</span>
            </div>
        </div>
    </div>
</div>
