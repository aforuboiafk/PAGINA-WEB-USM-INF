<div class="container">
    <div class="row">
        <div *ngFor="let card of news" class="col-12 col-lg-3 mb-4" (click)="goToNewsDetail(card.url)" style="cursor: pointer;">
            <div class="card" [style.backgroundImage]="getBackgroundBase64(card.image)">
                <h4 class="card-title">{{ card.title }}</h4>
                <span class="card-text">{{ formatDate(card.date) }}</span>
            </div>
        </div>
    </div>
</div>
