<app-hero 
    height="370px"
    backgroundImage="{{ new?.image }}"
    title="{{ new?.title }}">
</app-hero>
<div class="content">
    <div class="row">
        <div class="col-12 col-lg-8">
            {{ new?.description }}
            <app-redes-sociales-noticias></app-redes-sociales-noticias>
            <div class="row ">
                <div class="col d-flex align-items-center noticia-nav">
                    <div>
                        <fa-icon [icon]="faChevronLeft" class="chevron"></fa-icon>
                    </div>
                    <div>
                        <div>
                            <strong class="">Anterior</strong>
                        </div>
                        <span>oda</span>
                    </div>
                </div>
                <div class="col d-flex align-items-center justify-content-between noticia-nav">
                    <div class="flex-fill">
                        <div class="d-flex justify-content-end">
                            <strong >Siguiente</strong>
                        </div>
                        <span>xao</span>
                    </div>
                    <div>
                        <fa-icon [icon]="faChevronRight" class="chevron"></fa-icon>
                    </div>
                </div>

            </div>
        </div>
        <div class="col-12 col-lg-4">
            <app-noticias-recomendadas> </app-noticias-recomendadas>
        </div>

    </div>



</div>
